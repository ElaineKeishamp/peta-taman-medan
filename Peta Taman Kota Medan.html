<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Peta taman dan ruang terbuka hijau di Kota Medan berdasarkan data OpenStreetMap.">
<title>Peta Taman Kota Medan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{
    --bg:#ffffff; --ink:#1c2b22; --muted:#4f6055; --line:#dde4df;
    --brand:#2f6b3f; --soft:#f1f5f2; --warn:#8a3b0b; --warnbg:#fdf0dc;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;font-family:Lato,"Segoe UI",Arial,sans-serif;font-size:15px;background:var(--bg);color:var(--ink);line-height:1.45}
  header{padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
  header h1{margin:0;font-size:1.1rem;font-weight:700;color:var(--brand)}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr}
  aside{overflow-y:auto;padding:4px 14px 14px;border-right:1px solid var(--line);background:#fff}
  .mapwrap{position:relative;min-height:320px}
  #map{height:100%;width:100%}
  .sec{padding:12px 0;border-top:1px solid var(--line)}
  .sec:first-of-type{border-top:0}
  .sec h2{margin:0 0 8px;font-size:.9rem;font-weight:700}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
  .stat b{display:block;font-size:1.25rem;line-height:1.2}
  .stat span{font-size:.78rem;color:var(--muted)}
  button{font:inherit;cursor:pointer;border:1px solid #b9c7bd;background:#fff;color:var(--ink);border-radius:6px;padding:6px 10px;margin:0 4px 6px 0}
  button:hover:not(:disabled){background:var(--soft)}
  button:disabled{opacity:.45;cursor:default}
  button.active,button.active:hover:not(:disabled){background:var(--brand);border-color:var(--brand);color:#fff}
  button:focus-visible,input:focus-visible{outline:3px solid #e8a317;outline-offset:2px}
  input[type=search]{width:100%;padding:8px 10px;border:1px solid #b9c7bd;border-radius:6px;font:inherit}
  #status{font-size:.85rem;padding:8px 10px;border-radius:6px;background:var(--soft);color:var(--ink);margin:10px 0 2px}
  #status.err{background:var(--warnbg);color:var(--warn)}
  .results button{display:block;width:100%;text-align:left;margin:4px 0 0}
  .small{font-size:.8rem;color:var(--muted);margin:6px 0 0}
  .chk{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
  .chk input{width:16px;height:16px;margin:0}
  .chk i,.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:2px solid;flex:none}
  ul.nearest{margin:8px 0 0;padding:0;list-style:none}
  ul.nearest button{width:100%;text-align:left}
  .legend{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:.8rem;min-width:150px}
  .legend h4{margin:0 0 4px;font-size:.8rem}
  .legend div{display:flex;align-items:center;gap:7px;line-height:1.75}
  .legend em{margin-left:auto;padding-left:10px;font-style:normal;color:var(--muted)}
  .legend .src{margin-top:3px;padding-top:4px;border-top:1px solid var(--line);font-size:.7rem;color:var(--muted);display:block;line-height:1.3}
  .leaflet-popup-content{font-family:inherit;font-size:.85rem;line-height:1.4;color:var(--ink)}
  .leaflet-popup-content h4{margin:0 0 4px;font-size:.95rem}
  .leaflet-popup-content table{border-collapse:collapse}
  .leaflet-popup-content td{padding:1px 8px 1px 0;vertical-align:top}

  /* kotak hasil ukur di atas peta */
  #measure-box{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.35);padding:10px 14px 6px;text-align:center;min-width:230px;max-width:calc(100% - 110px)}
  .m-title{font-size:.78rem;color:var(--muted)}
  .m-value{font-size:1.9rem;font-weight:700;line-height:1.15}
  .m-hint{font-size:.78rem;color:var(--muted);margin:2px 0 8px}
  #measure-box button{margin:0 2px 4px;padding:5px 9px;font-size:.85rem}
  #map.measuring,#map.measuring .leaflet-grab,#map.measuring .leaflet-interactive{cursor:crosshair}
  #map.measuring .leaflet-interactive{pointer-events:none !important}
  .leaflet-tooltip.m-label{background:#fff;color:#7c2d12;border:1px solid #b45309;font-weight:700;padding:1px 5px;box-shadow:none}

  @media (max-width:800px){
    html,body{height:auto}
    body{display:block}
    .layout{display:grid;grid-template-columns:1fr;grid-template-rows:60vh auto}
    .mapwrap{order:-1}
    aside{border-right:0;border-top:1px solid var(--line);overflow:visible}
    .legend{font-size:.72rem;padding:5px 8px;min-width:0}
    .legend div{line-height:1.5}
    .legend .src{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>Peta Taman Kota Medan</h1>
</header>

<div class="layout">
  <aside aria-label="Panel peta">
    <div id="status" role="status" aria-live="polite">Memuat data...</div>

    <section class="sec" aria-label="Ringkasan">
      <h2>Ringkasan</h2>
      <div class="stats">
        <div class="stat"><b id="st-total">0</b><span>Objek</span></div>
        <div class="stat"><b id="st-area">0</b><span>Luas total (ha)</span></div>
        <div class="stat"><b id="st-named">0</b><span>Bernama</span></div>
        <div class="stat"><b id="st-unnamed">0</b><span>Tanpa nama</span></div>
      </div>
    </section>

    <section class="sec" aria-label="Cari taman">
      <h2>Cari taman</h2>
      <input id="q" type="search" placeholder="Nama taman" aria-label="Cari nama taman" autocomplete="off">
      <div class="results" id="results"></div>
    </section>

    <section class="sec" aria-label="Peta dasar">
      <h2>Peta dasar</h2>
      <div id="base-buttons"></div>
      <p class="small" id="base-note"></p>
    </section>

    <section class="sec" aria-label="Layer data">
      <h2>Layer</h2>
      <div id="layer-list"></div>
    </section>

    <section class="sec" aria-label="Alat peta">
      <h2>Alat</h2>
      <button id="btn-locate" type="button">Lokasi saya</button>
      <button id="btn-measure" type="button" aria-pressed="false">Ukur jarak</button>
      <button id="btn-fit" type="button">Lihat semua</button>
      <p class="small" id="nearest-note" hidden>Taman bernama terdekat, jarak garis lurus:</p>
      <ul class="nearest" id="nearest" aria-live="polite"></ul>
    </section>

    <section class="sec" aria-label="Data">
      <h2>Data</h2>
      <button id="btn-download" type="button">Unduh GeoJSON</button>
      <button id="btn-reload" type="button">Ambil ulang data taman</button>
    </section>
  </aside>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="Peta taman Kota Medan"></div>
    <div id="measure-box" hidden>
      <div class="m-title" id="m-title">Ukur jarak</div>
      <div class="m-value" id="m-value">0 m</div>
      <div class="m-hint" id="m-hint"></div>
      <div>
        <button id="m-undo" type="button">Batal titik</button>
        <button id="m-clear" type="button">Hapus</button>
        <button id="m-done" type="button">Selesai</button>
      </div>
    </div>
  </div>
</div>

<noscript>Peta ini butuh JavaScript.</noscript>

:"Polygon","coordinates":[[[98.6803548,3.58523],[98.6804503,3.5852922],[98.6804089,3.585361],[98.6803243,3.585502],[98.6802771,3.5855823],[98.6801751,3.5855225],[98.6802693,3.585372],[98.6803548,3.58523]]]}},{"type":"Feature","id":"way/1393445376","properties":{"@id":"way/1393445376","leisure":"park"},"geometry":{"type":"Polygon","coordinates":[[[98.691632,3.6959542],[98.6920222,3.6965126],[98.6924957,3.6972067],[98.6925442,3.6972796],[98.6916745,3.6978666],[98.6906062,3.6963508],[98.6905168,3.6960168],[98.691351,3.6959248],[98.6915026,3.6958136],[98.6915123,3.6958241],[98.691632,3.6959542]]]}},{"type":"Feature","id":"way/1399479079","properties":{"@id":"way/1399479079","leisure":"park"},"geometry":{"type":"Polygon","coordinates":[[[98.6925442,3.6972796],[98.6924957,3.6972067],[98.6960215,3.6948333],[98.6958655,3.6946384],[98.6958526,3.6945229],[98.6958735,3.694511],[98.6961304,3.6948838],[98.6960742,3.6949171],[98.6925442,3.6972796]]]}},{"type":"Feature","id":"way/1399479080","properties":{"@id":"way/1399479080","leisure":"park"},"geometry":{"type":"Polygon","coordinates":[[[98.6945755,3.6937799],[98.694629,3.6938498],[98.6946582,3.6938714],[98.6945514,3.6939439],[98.6943512,3.6940617],[98.691632,3.6959542],[98.6915123,3.6958241],[98.6945755,3.6937799]]]}},{"type":"Feature","id":"way/1446646603","properties":{"@id":"way/1446646603","leisure":"park","name":"Taman Kompleks Perumahan Pegawai Pemdasu","operator":"Pemerintah Provinsi Sumatera Utara","operator:type":"public/government"},"geometry":{"type":"Polygon","coordinates":[[[98.6652318,3.6157625],[98.6651391,3.6154939],[98.6650571,3.6152499],[98.6649005,3.6148107],[98.6648816,3.6147581],[98.6651367,3.6147263],[98.6651665,3.6147342],[98.6651783,3.614761],[98.6651998,3.61489],[98.6652107,3.614983],[98.665248,3.6153053],[98.665256,3.6153517],[98.6652938,3.6155817],[98.6652914,3.6156322],[98.6652781,3.6156916],[98.6652516,3.6157602],[98.6652467,3.615773],[98.6652433,3.6157799],[98.6652387,3.6157779],[98.6652318,3.6157 </script>
<script>
/* ============================================================
   PENGATURAN
   ============================================================ */
const CACHE_KEY = 'rth-medan-cache-v1';
const CACHE_MAX_AGE_MS = 7 * 24 * 3600 * 1000;
const MEDAN_CENTER = [3.5952, 98.6722];
const BBOX_FALLBACK = '3.45,98.55,3.72,98.78';
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
const CATS = {
  park:           { label: 'Taman',              color: '#15803d' },
  garden:         { label: 'Kebun / taman hias', color: '#65a30d' },
  playground:     { label: 'Taman bermain',      color: '#d97706' },
  nature_reserve: { label: 'Kawasan lindung',    color: '#0e7490' }
};

/* ============================================================
   UTIL
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rad = d => d * Math.PI / 180;
const normDl = d => ((d + 540) % 360 + 360) % 360 - 180;
const num = (n, d) => n.toFixed(d).replace('.', ',');

function setStatus(msg, isErr){
  const el = $('status');
  if (!msg){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
}
function fmtDist(m){ return m >= 1000 ? num(m / 1000, 2) + ' km' : Math.round(m) + ' m'; }
function fmtArea(m2){
  if (m2 >= 1e6) return num(m2 / 1e6, 2) + ' km²';
  if (m2 >= 1e4) return num(m2 / 1e4, 2) + ' ha';
  return Math.round(m2) + ' m²';
}
function ringArea(ring){
  const R = 6378137;
  let s = 0;
  for (let i = 0; i < ring.length - 1; i++){
    const dl = normDl(ring[i+1][0] - ring[i][0]);
    s += rad(dl) * (2 + Math.sin(rad(ring[i][1])) + Math.sin(rad(ring[i+1][1])));
  }
  return Math.abs(s * R * R / 2);
}
function polygonArea(rings){
  let a = ringArea(rings[0]);
  for (let i = 1; i < rings.length; i++) a -= ringArea(rings[i]);
  return Math.max(a, 0);
}
function featureArea(f){
  const g = f.geometry;
  if (!g) return 0;
  if (g.type === 'Polygon') return polygonArea(g.coordinates);
  if (g.type === 'MultiPolygon') return g.coordinates.reduce((t, p) => t + polygonArea(p), 0);
  return 0;
}

/* ============================================================
   PETA DAN BASEMAP
   ============================================================ */
const map = L.map('map', { center: MEDAN_CENTER, zoom: 12 });
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const esriAttr = 'Tiles &copy; Esri';
const basemaps = {
  'Esri Jalan': L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: esriAttr }),
  'Esri Satelit': L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: esriAttr }),
  'Esri Satelit + Label': L.layerGroup([
    L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: esriAttr }),
    L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
  ]),
  'Esri Topografi': L.tileLayer(ESRI + 'World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: esriAttr }),
  'OpenTopoMap': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, maxNativeZoom: 17, subdomains: 'abc',
      attribution: 'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; OpenTopoMap (CC-BY-SA)' })
};
let currentBase = 'Esri Jalan';
basemaps[currentBase].addTo(map);
map.attributionControl.addAttribution('Data taman: &copy; OpenStreetMap contributors (ODbL)');
L.control.scale({ metric: true, imperial: false }).addTo(map);

function syncBaseButtons(){
  document.querySelectorAll('#base-buttons button').forEach(btn => {
    const on = btn.dataset.base === currentBase;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
  });
}
function setBase(name){
  Object.values(basemaps).forEach(b => { if (map.hasLayer(b)) map.removeLayer(b); });
  basemaps[name].addTo(map);
  currentBase = name;
  syncBaseButtons();
}
Object.keys(basemaps).forEach(name => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = name;
  btn.dataset.base = name;
  btn.addEventListener('click', () => { $('base-note').textContent = ''; setBase(name); });
  $('base-buttons').appendChild(btn);
});
syncBaseButtons();

// Kalau tile suatu basemap gagal dimuat, pindah ke Esri Jalan
const tileErrors = {};
Object.keys(basemaps).forEach(name => {
  if (name === 'Esri Jalan') return;
  const b = basemaps[name];
  const tiles = b.getLayers ? b.getLayers() : [b];
  tiles.forEach(t => t.on('tileerror', () => {
    tileErrors[name] = (tileErrors[name] || 0) + 1;
    if (tileErrors[name] === 4 && currentBase === name){
      setBase('Esri Jalan');
      $('base-note').textContent = name + ' tidak bisa dimuat, dipindah ke Esri Jalan.';
    }
  }));
});

let groups = {};
let entries = [];
let lastGeojson = null;
let legendControl = null;
let firstFit = true;
const visible = {};

/* ============================================================
   AMBIL DATA
   ============================================================ */
function buildQuery(useBbox){
  const filt = '["leisure"~"^(park|garden|playground|nature_reserve)$"]';
  const head = '[out:json][timeout:60];';
  if (useBbox) return head + '(nwr' + filt + '(' + BBOX_FALLBACK + '););out body;>;out skel qt;';
  return head +
    'area["boundary"="administrative"]["name"~"^(Kota )?Medan$"]["admin_level"~"^(5|6)$"]->.a;' +
    '(nwr(area.a)' + filt + ';);out body;>;out skel qt;';
}
async function overpassRequest(query){
  const errs = [];
  for (const url of OVERPASS_ENDPOINTS){
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 45000);
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query),
        signal: ctrl.signal
      });
      clearTimeout(t);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      errs.push(new URL(url).hostname + ': ' + (e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'gagal'));
    }
  }
  throw new Error(errs.join(' | '));
}
async function fetchFromOverpass(){
  if (typeof osmtogeojson !== 'function') throw new Error('osmtogeojson tidak termuat');
  let osm = await overpassRequest(buildQuery(false));
  if (!(osm.elements || []).some(e => e.tags && e.tags.leisure)) osm = await overpassRequest(buildQuery(true));
  const gj = osmtogeojson(osm);
  gj._meta = { source: 'OpenStreetMap via Overpass API', fetched: new Date().toISOString() };
  return gj;
}
function readCache(){
  try {
    const obj = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (!obj || !obj._meta || Date.now() - new Date(obj._meta.fetched).getTime() > CACHE_MAX_AGE_MS) return null;
    return obj;
  } catch (e) { return null; }
}
function writeCache(gj){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(gj)); } catch (e) {} }

async function loadData(force){
  setStatus('Memuat data...');
  let gj = null;
  try {
    if (!force && window.RTH_GEOJSON) gj = window.RTH_GEOJSON;
    if (!gj && !force) gj = readCache();
    if (!gj){ gj = await fetchFromOverpass(); writeCache(gj); }
    render(gj);
  } catch (e) {
    console.warn('Gagal memuat data:', e);
    setStatus('Data belum bisa dimuat (' + (e && e.message ? e.message : 'jaringan bermasalah') +
      '). Coba tombol "Ambil ulang data taman".', true);
  }
}

/* ============================================================
   TAMPILKAN DATA
   ============================================================ */
function popupHtml(f, cat, areaM2){
  const p = f.properties || {};
  const name = p.name ? esc(p.name) : '<i>Tanpa nama</i>';
  const rows = [['Jenis', esc(CATS[cat].label)]];
  rows.push(['Luas', areaM2 > 0 ? fmtArea(areaM2) : 'Titik, tanpa luas']);
  const addr = [p['addr:street'], p['addr:suburb'] || p['addr:city']].filter(Boolean).map(esc).join(', ');
  if (addr) rows.push(['Alamat', addr]);
  if (p.operator) rows.push(['Pengelola', esc(p.operator)]);
  if (p.access) rows.push(['Akses', esc(p.access)]);
  if (p.opening_hours) rows.push(['Jam buka', esc(p.opening_hours)]);
  const idStr = String(f.id || '');
  const link = /^(node|way|relation)\/\d+$/.test(idStr)
    ? '<div style="margin-top:4px"><a href="https://www.openstreetmap.org/' + idStr + '" target="_blank" rel="noopener">Lihat di OpenStreetMap</a></div>' : '';
  return '<h4>' + name + '</h4><table>' +
    rows.map(r => '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td></tr>').join('') + '</table>' + link;
}

function render(gj){
  lastGeojson = gj;
  Object.values(groups).forEach(g => map.removeLayer(g));
  if (legendControl) map.removeControl(legendControl);
  groups = {}; entries = [];

  const feats = (gj.features || []).filter(f => f.geometry && f.properties &&
    CATS[f.properties.leisure] && /^(Point|Polygon|MultiPolygon)$/.test(f.geometry.type));
  const byCat = {};
  Object.keys(CATS).forEach(k => byCat[k] = { feats: [] });
  let totalArea = 0, named = 0;
  feats.forEach(f => {
    f._area = featureArea(f);
    byCat[f.properties.leisure].feats.push(f);
    totalArea += f._area;
    if (f.properties.name) named++;
  });

  Object.keys(CATS).forEach(cat => {
    const c = CATS[cat];
    const layer = L.geoJSON({ type: 'FeatureCollection', features: byCat[cat].feats }, {
      style: () => ({ color: c.color, weight: 2, fillColor: c.color, fillOpacity: 0.4 }),
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: c.color, fillOpacity: 0.95 }),
      onEachFeature: (f, lyr) => {
        lyr.bindPopup(popupHtml(f, cat, f._area), { maxWidth: 280 });
        if (f.properties.name) lyr.bindTooltip(f.properties.name, { sticky: true });
        const center = lyr.getBounds ? lyr.getBounds().getCenter() : lyr.getLatLng();
        entries.push({ name: f.properties.name || '', cat, layer: lyr, center });
      }
    });
    groups[cat] = layer;
    if (visible[cat] !== false) layer.addTo(map);
  });

  // daftar layer di panel samping
  const box = $('layer-list');
  box.innerHTML = '';
  const present = Object.keys(CATS).filter(c => byCat[c].feats.length);
  present.forEach(cat => {
    const lab = document.createElement('label');
    lab.className = 'chk';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.cat = cat;
    cb.checked = visible[cat] !== false;
    cb.addEventListener('change', () => {
      visible[cat] = cb.checked;
      if (cb.checked) groups[cat].addTo(map); else map.removeLayer(groups[cat]);
    });
    const sw = document.createElement('i');
    sw.style.borderColor = CATS[cat].color;
    sw.style.background = CATS[cat].color + '66';
    const tx = document.createElement('span');
    tx.textContent = CATS[cat].label + ' (' + byCat[cat].feats.length + ')';
    lab.append(cb, sw, tx);
    box.appendChild(lab);
  });

  // legenda di peta
  legendControl = L.control({ position: 'bottomleft' });
  legendControl.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = '<h4>Legenda</h4>' + present.map(cat =>
      '<div><i style="border-color:' + CATS[cat].color + ';background:' + CATS[cat].color + '66"></i>' +
      esc(CATS[cat].label) + '<em>' + byCat[cat].feats.length + '</em></div>').join('') +
      '<span class="src">Data: OpenStreetMap</span>';
    return d;
  };
  legendControl.addTo(map);

  $('st-total').textContent = feats.length;
  $('st-area').textContent = num(totalArea / 1e4, 1);
  $('st-named').textContent = named;
  $('st-unnamed').textContent = feats.length - named;

  if (firstFit && feats.length){
    const bb = L.featureGroup(Object.values(groups)).getBounds();
    if (bb.isValid()) map.fitBounds(bb, { padding: [20, 20], maxZoom: 14 });
    firstFit = false;
  }
  setStatus(feats.length ? '' : 'Tidak ada data yang cocok.', !feats.length);
}

/* ============================================================
   PENCARIAN
   ============================================================ */
function focusEntry(e){
  showMap();
  if (!map.hasLayer(groups[e.cat])){
    groups[e.cat].addTo(map);
    visible[e.cat] = true;
    const cb = document.querySelector('#layer-list input[data-cat="' + e.cat + '"]');
    if (cb) cb.checked = true;
  }
  if (e.layer.getBounds) map.fitBounds(e.layer.getBounds(), { maxZoom: 17, padding: [30, 30] });
  else map.setView(e.layer.getLatLng(), 17);
  e.layer.openPopup();
}
$('q').addEventListener('input', ev => {
  const term = ev.target.value.trim().toLowerCase();
  const box = $('results');
  box.innerHTML = '';
  if (term.length < 2) return;
  const hits = entries.filter(e => e.name && e.name.toLowerCase().includes(term)).slice(0, 8);
  if (!hits.length){ box.innerHTML = '<p class="small">Tidak ditemukan.</p>'; return; }
  hits.forEach(e => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = e.name;
    b.addEventListener('click', () => focusEntry(e));
    box.appendChild(b);
  });
});

/* ============================================================
   LOKASI SAYA
   ============================================================ */
const userLayer = L.layerGroup().addTo(map);
$('btn-locate').addEventListener('click', () => {
  showMap();
  setStatus('Mencari lokasi...');
  map.locate({ setView: true, maxZoom: 16, timeout: 10000 });
});
map.on('locationfound', e => {
  userLayer.clearLayers();
  L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 2, fillColor: '#2563eb', fillOpacity: 1 })
    .addTo(userLayer).bindPopup('Lokasi kamu (akurasi sekitar ' + Math.round(e.accuracy) + ' m)').openPopup();
  L.circle(e.latlng, { radius: e.accuracy, color: '#2563eb', weight: 1, fillOpacity: 0.08, interactive: false }).addTo(userLayer);
  const list = $('nearest');
  list.innerHTML = '';
  setStatus('');
  const named = entries.filter(x => x.name);
  $('nearest-note').hidden = !named.length;
  named.map(x => ({ x, d: e.latlng.distanceTo(x.center) }))
    .sort((a, b) => a.d - b.d).slice(0, 3)
    .forEach(({ x, d }) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = x.name + ', ' + fmtDist(d);
      b.addEventListener('click', () => focusEntry(x));
      li.appendChild(b);
      list.appendChild(li);
    });
});
map.on('locationerror', () => setStatus('Lokasi tidak bisa diakses. Cek izin lokasi di browser.', true));

/* ============================================================
   UKUR JARAK
   Saat mode ukur aktif, taman tidak menangkap klik (lihat CSS .measuring),
   jadi titik bisa diletakkan di mana saja, termasuk di atas taman.
   ============================================================ */
const mapEl = map.getContainer();
function showMap(){
  if (window.innerWidth <= 800) mapEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const mBox = $('measure-box');
L.DomEvent.disableClickPropagation(mBox);
L.DomEvent.disableScrollPropagation(mBox);
let measuring = false, mPoints = [], mLine = null;
const mDots = L.layerGroup().addTo(map);

function mTotal(){
  let t = 0;
  for (let i = 1; i < mPoints.length; i++) t += mPoints[i-1].distanceTo(mPoints[i]);
  return t;
}
function mRedraw(){
  mDots.clearLayers();
  if (mLine){ map.removeLayer(mLine); mLine = null; }
  if (mPoints.length){
    mLine = L.polyline(mPoints, { color: '#b45309', weight: 3, dashArray: '6 6', interactive: false }).addTo(map);
    let cum = 0;
    mPoints.forEach((pt, i) => {
      if (i > 0) cum += mPoints[i-1].distanceTo(pt);
      const dot = L.circleMarker(pt, { radius: 5, color: '#fff', weight: 2, fillColor: '#b45309', fillOpacity: 1, interactive: false }).addTo(mDots);
      if (i > 0) dot.bindTooltip(fmtDist(cum), { permanent: true, direction: 'top', offset: [0, -6], className: 'm-label' });
    });
  }
  $('m-title').textContent = measuring ? 'Ukur jarak' : 'Hasil ukur';
  $('m-value').textContent = fmtDist(mTotal());
  $('m-hint').textContent = measuring
    ? (mPoints.length ? mPoints.length + ' titik. Klik lagi untuk lanjut.' : 'Klik titik pertama di peta.')
    : mPoints.length + ' titik';
  $('m-undo').disabled = !measuring || !mPoints.length;
  $('m-clear').disabled = !mPoints.length;
}
function setMeasuring(on){
  measuring = on;
  mapEl.classList.toggle('measuring', on);
  const btn = $('btn-measure');
  btn.classList.toggle('active', on);
  btn.setAttribute('aria-pressed', String(on));
  if (on){
    showMap();
    map.closePopup();
    map.doubleClickZoom.disable();
    mBox.hidden = false;
  } else {
    map.doubleClickZoom.enable();
    if (!mPoints.length) mBox.hidden = true;
  }
  mRedraw();
}
$('btn-measure').addEventListener('click', () => setMeasuring(!measuring));
$('m-done').addEventListener('click', () => setMeasuring(false));
$('m-undo').addEventListener('click', () => { mPoints.pop(); mRedraw(); });
$('m-clear').addEventListener('click', () => {
  mPoints = [];
  if (!measuring) mBox.hidden = true;
  mRedraw();
});
map.on('click', e => {
  if (!measuring) return;
  mPoints.push(e.latlng);
  mRedraw();
});

/* ============================================================
   TOMBOL LAIN
   ============================================================ */
$('btn-fit').addEventListener('click', () => {
  const b = L.featureGroup(Object.values(groups)).getBounds();
  if (b.isValid()) map.fitBounds(b, { padding: [20, 20] });
});
$('btn-download').addEventListener('click', () => {
  if (!lastGeojson){ setStatus('Belum ada data untuk diunduh.', true); return; }
  const blob = new Blob([JSON.stringify(lastGeojson)], { type: 'application/geo+json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rth-medan.geojson';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('btn-reload').addEventListener('click', () => {
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  loadData(true);
});

loadData(false);
</script>
</body>
</html>
